name: Daily Anki reviews to Beeminder

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Sync AnkiWeb and calculate the value without writing to Beeminder
        required: false
        default: false
        type: boolean
  schedule:
    # 21:05 Europe/Ljubljana; deliberately off the hour to reduce queue delays.
    - cron: "5 21 * * *"
      timezone: Europe/Ljubljana

jobs:
  daily-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: anki-beeminder-daily
      cancel-in-progress: false
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install headless Anki dependency
        run: python -m pip install --disable-pip-version-check -r requirements-worker.txt

      - name: Sync reviews_today to Beeminder
        env:
          ANKIWEB_USERNAME: ${{ secrets.ANKIWEB_USERNAME }}
          ANKIWEB_PASSWORD: ${{ secrets.ANKIWEB_PASSWORD }}
          BEEMINDER_USER: ${{ secrets.BEEMINDER_USER }}
          BEEMINDER_TOKEN: ${{ secrets.BEEMINDER_TOKEN }}
          BEEMINDER_GOAL: ${{ secrets.BEEMINDER_GOAL }}
          ANKI_DECK_FILTER: ${{ vars.ANKI_DECK_FILTER }}
          ANKI_TIMEZONE: ${{ vars.ANKI_TIMEZONE || 'Europe/Ljubljana' }}
        run: |
          args=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m scripts.daily_beeminder_sync "${args[@]}"
